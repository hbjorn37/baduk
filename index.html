<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baduk (Go)</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Baduk <small>Go / Weiqi</small></h1>
    </header>
    <main>
      <section class="board-wrap">
        <div id="board"></div>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="message" role="alert"></p>
      </section>

      <section class="panel">
        <fieldset>
          <legend>Game</legend>
          <div class="row">
            <button id="undo" type="button">Undo</button>
            <button id="pass" type="button">Pass</button>
            <button id="score" type="button">Score</button>
          </div>
          <div class="row">
            <select id="size" aria-label="Board size">
              <option value="19">19×19</option>
              <option value="13">13×13</option>
              <option value="9">9×9</option>
            </select>
            <button id="new" type="button">New game</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Record</legend>
          <div class="row">
            <button id="first" type="button" aria-label="First move">⏮</button>
            <button id="back" type="button" aria-label="Previous move">◀</button>
            <button id="forward" type="button" aria-label="Next move">▶</button>
            <button id="last" type="button" aria-label="Last move">⏭</button>
          </div>
          <div class="row">
            <label class="button"
              >Open SGF<input id="open" type="file" accept=".sgf,text/plain" hidden
            /></label>
            <button id="save" type="button">Save SGF</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Stone color</legend>
          <label><input type="radio" name="color" value="auto" checked /> Auto (alternate)</label>
          <label><input type="radio" name="color" value="black" /> Black</label>
          <label><input type="radio" name="color" value="white" /> White</label>
          <label
            ><input type="radio" name="color" value="mouse" /> Mouse (left = white, right =
            black)</label
          >
        </fieldset>

        <fieldset>
          <legend>Display</legend>
          <label><input id="showStones" type="checkbox" checked /> Show stones</label>
          <label><input id="showNumbers" type="checkbox" checked /> Move numbers</label>
        </fieldset>
      </section>
    </main>
    <footer><p>© 2013–2026 gizrak · GPL-3.0</p></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
